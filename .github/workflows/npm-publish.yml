name: npm-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    uses: sapphire-sh/github-actions/.github/workflows/node-publish-template.yml@main
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    with:
      release_tag: ${{ inputs.tag }}
      run_tests: true
      runner: ubuntu-latest
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
      MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
      MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
