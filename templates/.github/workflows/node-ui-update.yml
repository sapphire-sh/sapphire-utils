name: node-ui-update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    uses: sapphire-sh/github-actions/.github/workflows/node-sapphire-package-update-template.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      PULL_REQUEST_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
    with:
      package_name: '@sapphire-sh/ui'
      branch_name: chore/sapphire-ui
