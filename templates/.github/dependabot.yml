version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 * * *'
    groups:
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@sapphire-sh/utils'
    cooldown:
      exclude:
        - '@sapphire-sh/utils'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 * * *'
